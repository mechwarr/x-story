// Top-level build file where you can add configuration options common to all sub-projects/modules.

def KOTLIN_VERSION = (findProperty("KOTLIN_VERSION") ?: "2.1.20") as String
def AGP_VERSION    = (findProperty("AGP_VERSION")    ?: "8.8.2")  as String

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:${AGP_VERSION}")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${KOTLIN_VERSION}")
  }
}

// React Native Android AAR 來源（直接用相對路徑，不使用 settings.gradle 的 providers.exec）
def reactNativeAndroidDir = file("$rootDir/../node_modules/react-native/android")

allprojects {
  repositories {
    // 讓 Gradle 能從 node_modules 解析 RN 的 AAR
    maven { url reactNativeAndroidDir }
    // 若專案使用 JSC，可保留（Hermes 時可略）
    maven { url "$rootDir/../node_modules/jsc-android/dist" }

    google()
    mavenCentral()
    maven { url "https://www.jitpack.io" }
    // 添加微信 SDK 可能的 Maven 倉庫
    maven { url "https://repo1.maven.org/maven2/" }
  }
}

// Expo 與 RN 頂層外掛（保持你原本設定）
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
