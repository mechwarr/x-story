    }
}

// 從 Google Play 下載的應用簽名證書生成 Facebook KeyHash
task getGooglePlayFacebookKeyHash {
    group = 'signing'
    description = 'Get Facebook KeyHash from Google Play App Signing certificate'
    doLast {
        // 尋找可能的證書檔案名稱
        def possibleCertFiles = [
            'deployment_cert.der',
            'deployment_cert.pem',
            'google_play_cert.der',
            'google_play_cert.pem',
            'app_signing_cert.der',
            'app_signing_cert.pem'
        ]
        
        def certFile = null
        for (def fileName : possibleCertFiles) {
            def file = file(fileName)
            if (file.exists()) {
                certFile = file
                break
            }
        }
        
        if (certFile == null) {
            println "❌ 找不到 Google Play 應用簽名證書"
            println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            println "📥 請先從 Google Play Console 下載應用簽名證書："
            println "   1. 前往 Google Play Console → 您的應用"
            println "   2. 進入「發布」→「設定」→「應用程式簽署」"
            println "   3. 在「應用程式簽署金鑰憑證」區塊中，點擊「下載憑證」"
            println "   4. 將下載的證書檔案（通常是 deployment_cert.der）放到："
            println "      ${projectDir.absolutePath}/"
            println "   5. 然後重新執行此 task"
            println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            return
        }
        
        println "🔑 從 Google Play 應用簽名證書生成 Facebook KeyHash..."
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        println "📄 使用證書檔案: ${certFile.name}"
        
        try {
            // 導出證書為 DER 格式（統一處理）
            def exportResult = new ByteArrayOutputStream()
            def certFormat = certFile.name.endsWith('.der') ? 'DER' : 'PEM'
            exec {
                commandLine 'openssl', 'x509', '-inform', certFormat,
                    '-in', certFile.absolutePath, '-outform', 'DER'
                standardOutput = exportResult
                errorOutput = new ByteArrayOutputStream()
            }
            
            // 計算 SHA-1 並轉換為 Base64
            def hashResult = new ByteArrayOutputStream()
            exec {
                commandLine 'openssl', 'sha1', '-binary'
                standardInput = new ByteArrayInputStream(exportResult.toByteArray())
                standardOutput = hashResult
                errorOutput = new ByteArrayOutputStream()
            }
            
            def base64Result = new ByteArrayOutputStream()
            exec {
                commandLine 'openssl', 'base64'
                standardInput = new ByteArrayInputStream(hashResult.toByteArray())
                standardOutput = base64Result
                errorOutput = new ByteArrayOutputStream()
            }
            
            def keyHash = base64Result.toString().trim()
            if (keyHash) {
                println "✅ Google Play Facebook KeyHash: ${keyHash}"
                println "📍 請將此值添加到 Facebook 開發者後台的「Key Hashes」中"
                println "⚠️  這是正式版必須使用的 KeyHash！"
            } else {
                println "❌ 無法從證書生成 KeyHash"
            }
        } catch (Exception e) {
            println "❌ 處理證書時發生錯誤: ${e.message}"
            println "   請確認證書檔案格式正確且已安裝 openssl"
        }
        
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    }
}

// 一次性獲取所有簽名信息（方便查看）
task getAllSignatures {
    group = 'signing'
    description = 'Get all signature fingerprints (SHA-1 and MD5) for both debug and release keystores'
    doLast {
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        println "📋 獲取所有簽名信息"
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
        
        // Debug 簽名
        println "🔵 DEBUG 簽名（用於開發測試）"
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        def debugKeystore = file('debug.keystore')
        if (debugKeystore.exists()) {
            def debugResult = new ByteArrayOutputStream()
            exec {
                commandLine 'keytool', '-list', '-v',
                    '-keystore', debugKeystore,
                    '-alias', 'androiddebugkey',
                    '-storepass', 'android',
                    '-keypass', 'android'
                standardOutput = debugResult
            }
            def debugOutput = debugResult.toString()
            def debugSha1Match = debugOutput =~ /SHA1:\s*([A-F0-9:]+)/
            def debugMd5 = getMD5FromKeystore(debugKeystore, 'androiddebugkey', 'android', 'android')
            
            if (debugMd5) {
                println "   MD5:  ${debugMd5}"
            } else {
                println "   MD5:  ❌ 無法獲取（需要 openssl）"
            }
            if (debugSha1Match) {
                def debugSha1 = debugSha1Match[0][1].replaceAll(':', '')
                println "   SHA1: ${debugSha1}"
            }
        } else {
            println "   ❌ Debug keystore 不存在"
        }
        println ""
        
        // Release 簽名
        println "🟢 RELEASE 簽名（用於正式版）"
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
            def releaseKeystore = file(MYAPP_UPLOAD_STORE_FILE)
            if (releaseKeystore.exists()) {
                def releaseResult = new ByteArrayOutputStream()
                exec {
                    commandLine 'keytool', '-list', '-v',
                        '-keystore', releaseKeystore,
                        '-alias', MYAPP_UPLOAD_KEY_ALIAS,
                        '-storepass', MYAPP_UPLOAD_STORE_PASSWORD,
                        '-keypass', MYAPP_UPLOAD_KEY_PASSWORD
                    standardOutput = releaseResult
                }
                def releaseOutput = releaseResult.toString()
                def releaseSha1Match = releaseOutput =~ /SHA1:\s*([A-F0-9:]+)/
                def releaseMd5 = getMD5FromKeystore(releaseKeystore, MYAPP_UPLOAD_KEY_ALIAS,
                    MYAPP_UPLOAD_STORE_PASSWORD, MYAPP_UPLOAD_KEY_PASSWORD)
                
                if (releaseMd5) {
                    println "   MD5:  ${releaseMd5}"
                } else {
                    println "   MD5:  ❌ 無法獲取（需要 openssl）"
                }
                if (releaseSha1Match) {
                    def releaseSha1 = releaseSha1Match[0][1].replaceAll(':', '')
                    println "   SHA1: ${releaseSha1}"
                }
            } else {
                println "   ❌ Release keystore 不存在: ${MYAPP_UPLOAD_STORE_FILE}"
            }
        } else {
            println "   ❌ Release keystore 未配置"
        }
        println ""
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        println "💡 提示："
        println "   • WeChat SDK 需要 MD5 簽名"
        println "   • 正式版必須使用 RELEASE 簽名"
        println "   • 測試時可以使用 DEBUG 簽名"
        println "   • 建議在微信後台同時添加兩個簽名"
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.rueiyang.story'
    defaultConfig {
        applicationId 'com.rueiyang.story'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 57
        versionName "1.0.48"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
            debuggable false
        }
    }
    
    // 自動保存 mapping.txt 到固定位置，方便上傳到 Google Play Console
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            // 處理 APK 構建
            variant.assembleProvider.get().doLast {
                saveMappingFile(variant)
            }
            
            // 處理 AAB 構建 - 使用任務名稱
            def bundleTask = tasks.findByName("bundle${variant.name.capitalize()}")
            if (bundleTask != null) {
                bundleTask.doLast {
                    saveMappingFile(variant)
                }
            }
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation 'com.facebook.android:facebook-android-sdk:latest.release' 
    implementation "io.github.hyochan.openiap:openiap-google:1.2.6"
    // 微信官方 SDK
    // ⚠️ 重要：微信 SDK 無法從 Maven 倉庫直接獲取，需要手動下載 AAR 文件
    // 
    // 設置步驟：
    // 1. 前往 https://developers.weixin.qq.com/doc/oplatform/Downloads/Android_Resource.html 下載最新版本
    // 2. 將下載的 AAR 文件（如 wechat-sdk-android-without-mta-6.8.24.aar）放到 android/app/libs/ 目錄
    // 3. 取消下面的 implementation files 註釋，並確保文件名與下載的文件一致
    // 4. 詳細說明請查看 android/app/WECHAT_SDK_SETUP.md
    //
    // 微信 SDK - 使用本地 AAR 文件
    implementation files('libs/wechat-sdk-android-without-mta-6.8.0.aar')   

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
