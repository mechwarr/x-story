// 獲取 MD5 簽名（用於 WeChat SDK 配置）
// 使用 openssl 從證書中提取 MD5（因為新版本 keytool 不再顯示 MD5）
def getMD5FromKeystore(keystoreFile, alias, storePass, keyPass) {
    def tempCert = File.createTempFile("cert", ".pem")
    try {
        // 導出證書
        exec {
            commandLine 'keytool', '-exportcert', '-alias', alias,
                '-keystore', keystoreFile,
                '-storepass', storePass,
                '-file', tempCert.absolutePath
            ignoreExitValue = true
        }
        // 使用 openssl 獲取 MD5
        def result = new ByteArrayOutputStream()
        exec {
            commandLine 'openssl', 'x509', '-fingerprint', '-md5', '-noout', '-in', tempCert.absolutePath
            standardOutput = result
            errorOutput = result
            ignoreExitValue = true
        }
        def output = result.toString().trim()
        def md5Match = output =~ /MD5 Fingerprint=([A-F0-9:]+)/
        if (md5Match) {
            return md5Match[0][1].replaceAll(':', '')
        }
        return null
    } catch (Exception e) {
        return null
    } finally {
        tempCert.delete()
    }
}

