// 獲取 Facebook KeyHash（用於 Facebook SDK 配置）
// Facebook KeyHash 是 SHA-1 指紋的 Base64 編碼
def getFacebookKeyHash(keystoreFile, alias, storePass, keyPass) {
    try {
        def result = new ByteArrayOutputStream()
        exec {
            commandLine 'keytool', '-exportcert', '-alias', alias,
                '-keystore', keystoreFile,
                '-storepass', storePass,
                '-keypass', keyPass
            standardOutput = result
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        // 使用 openssl 計算 SHA-1 並轉換為 Base64
        def base64Result = new ByteArrayOutputStream()
        exec {
            commandLine 'sh', '-c', "echo '${result.toString()}' | openssl sha1 -binary | openssl base64"
            standardOutput = base64Result
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def keyHash = base64Result.toString().trim()
        return keyHash ?: null
    } catch (Exception e) {
        return null
    }
}

