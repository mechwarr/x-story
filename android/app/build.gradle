        println "🔑 獲取 Release keystore 的 Facebook KeyHash（上傳金鑰）..."
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        println "⚠️  注意：如果已啟用 Google Play App Signing，此 KeyHash 不會生效！"
        println "   請使用 getGooglePlayFacebookKeyHash task 獲取正確的 KeyHash"
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        // 直接使用命令獲取（更可靠）
        def result = new ByteArrayOutputStream()
        exec {
            commandLine 'keytool', '-exportcert', '-alias', MYAPP_UPLOAD_KEY_ALIAS,
                '-keystore', keystoreFile.absolutePath,
                '-storepass', MYAPP_UPLOAD_STORE_PASSWORD,
