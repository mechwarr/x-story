            standardOutput = result
            errorOutput = new ByteArrayOutputStream()
        }
        def base64Result = new ByteArrayOutputStream()
        exec {
            commandLine 'openssl', 'sha1', '-binary'
            standardInput = new ByteArrayInputStream(result.toByteArray())
            standardOutput = base64Result
            errorOutput = new ByteArrayOutputStream()
        }
        def finalResult = new ByteArrayOutputStream()
        exec {
            commandLine 'openssl', 'base64'
            standardInput = new ByteArrayInputStream(base64Result.toByteArray())
            standardOutput = finalResult
            errorOutput = new ByteArrayOutputStream()
        }
        def keyHash = finalResult.toString().trim()
