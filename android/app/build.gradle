/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// 保存 mapping 文件的輔助函數
def saveMappingFile(variant) {
    def mappingFile = file("${projectDir}/build/outputs/mapping/${variant.name}/mapping.txt")
    if (mappingFile.exists()) {
        def mappingDir = file("${projectDir}/mapping")
        mappingDir.mkdirs()
        def targetMappingFile = file("${mappingDir}/mapping-${variant.versionName}-${variant.versionCode}.txt")
        copy {
            from mappingFile
            into mappingDir
            rename { "mapping-${variant.versionName}-${variant.versionCode}.txt" }
        }
        println "✅ Mapping file saved to: ${targetMappingFile.absolutePath}"
        println "📦 Upload this file to Google Play Console when uploading the AAB/APK"
    } else {
        println "⚠️  Mapping file not found at: ${mappingFile.absolutePath}"
        println "   This is normal if ProGuard/R8 is not enabled or minifyEnabled is false"
    }
}

// 獲取 SHA-1 憑證指紋的輔助任務（用於 Google Sign-In 配置）
task getDebugSha1 {
    group = 'signing'
    description = 'Get SHA-1 fingerprint for debug keystore (for Google Sign-In)'
    doLast {
        def keystoreFile = file('debug.keystore')
        if (!keystoreFile.exists()) {
            println "❌ Debug keystore not found at: ${keystoreFile.absolutePath}"
            return
        }
        println "🔑 Getting SHA-1 for Debug keystore..."
        println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        exec {
            commandLine 'keytool', '-list', '-v',
                '-keystore', keystoreFile,
                '-alias', 'androiddebugkey',
                '-storepass', 'android',
                '-keypass', 'android'
