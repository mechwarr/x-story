# ==============================
# Project-wide Gradle settings
# ==============================

# 提升記憶體（Kotlin 2.x/AGP 8.x 建議）
# -Xmx4g：Gradle Daemon 最大記憶體
# -Dkotlin.daemon.jvm.options=-Xmx2g：Kotlin Daemon 記憶體
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2g

# 若需要可開平行（大型專案先觀察再開）
# org.gradle.parallel=true

# AndroidX 與 Jetifier
android.useAndroidX=true
android.enableJetifier=true

# 這個 flag 會讓 R 類別不再傳遞，縮短編譯時間
android.nonTransitiveRClass=true

# 針對 release 啟用 PNG crunch（你的 build.gradle 有對應判讀）
android.enablePngCrunchInReleaseBuilds=true

# ===== ProGuard/R8 設定 =====
# 啟用 ProGuard/R8 以縮減應用程式大小並生成去模糊化檔案
android.enableProguardInReleaseBuilds=true
# 啟用資源壓縮（需要配合 minifyEnabled）
android.enableShrinkResourcesInReleaseBuilds=true

# ===== React Native/Expo =====
# 建置架構
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
# 新架構（TurboModules / Fabric）
newArchEnabled=true
# Hermes 引擎
hermesEnabled=true

# Expo 圖片編碼支援
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Expo 其它設定
EX_DEV_CLIENT_NETWORK_INSPECTOR=true
expo.useLegacyPackaging=false

# ===== Keystore（請確認檔案位於 android/app/waei0204.keystore）=====
MYAPP_UPLOAD_STORE_FILE=waei0204.keystore
MYAPP_UPLOAD_KEY_ALIAS=mechwarr
MYAPP_UPLOAD_STORE_PASSWORD=waei0204
MYAPP_UPLOAD_KEY_PASSWORD=waei0204

# ===== App 版號（可配合自動 +1 任務使用）=====
VERSION_CODE=132
VERSION_NAME=1.0.129

# ===== Toolchain 版本（供頂層 build.gradle 讀取）=====
KOTLIN_VERSION=2.1.20
AGP_VERSION=8.8.2

# Kotlin 代碼風格（官方建議）
kotlin.code.style=official

# Whether the app is configured to use edge-to-edge via the app config or `react-native-edge-to-edge` plugin
expo.edgeToEdgeEnabled=false